# API registry (ADR-010). A provider can only be enabled if its status is VERIFIED_FREE or
# VERIFIED_LIMITED, it needs no key, and it has an internal budget. Never put a key here.
# `provider_limits` = what the provider documents (empty = unknown, see docs/API_LIMITS.md).
# `internal_budget` = what AMBRE enforces, always at or below the documented limit.
# Relevance values in `capabilities` are a-priori weights, not measurements.
providers:
  usgs_earthquakes:
    name: USGS Earthquake Catalog
    domain: seismic
    status: VERIFIED_FREE
    enabled: true
    authentication: none
    verified_on: "2026-11-02"
    provider_limits: {}
    internal_budget: {min_interval_seconds: 60, per_hour: 30, per_day: 500}
    reserve_fraction: 0.2
    freshness_seconds: 600
    capabilities: {recent_earthquakes: 0.9}

  nasa_eonet:
    name: NASA EONET v3
    domain: natural_events
    status: VERIFIED_FREE
    enabled: false
    verified_on: "2026-11-02"
    provider_limits: {}
    internal_budget: {min_interval_seconds: 300, per_day: 200}
    freshness_seconds: 1800

  open_meteo:
    name: Open-Meteo
    domain: weather
    status: VERIFIED_LIMITED
    enabled: true
    authentication: none
    verified_on: "2026-11-02"
    allow_commercial_use: false  # the free API is non-commercial only (docs/DATA_LICENSES.md)
    provider_limits: {per_minute: 600, per_hour: 5000, per_day: 10000}
    internal_budget: {per_minute: 20, per_hour: 120, per_day: 500}
    reserve_fraction: 0.2
    freshness_seconds: 3600
    capabilities: {weather_forecast: 0.8}

  gdelt:
    name: GDELT DOC 2.0
    domain: news
    status: VERIFIED_LIMITED
    enabled: true
    authentication: none
    verified_on: "2026-11-02"
    # Free use including commercial; citing GDELT is required where results are shown.
    allow_commercial_use: true
    provider_limits: {min_interval_seconds: 5}
    internal_budget: {min_interval_seconds: 10, per_hour: 300, per_day: 2000}
    reserve_fraction: 0.2
    freshness_seconds: 21600  # a week-long news search does not change in a few minutes
    capabilities: {general_news: 0.5}

  hacker_news:
    name: Hacker News API
    domain: technology
    status: VERIFIED_FREE
    enabled: false
    verified_on: "2026-11-02"
    provider_limits: {}
    internal_budget: {min_interval_seconds: 1, per_hour: 600}
    freshness_seconds: 600

  github:
    name: GitHub REST API
    domain: technology
    status: VERIFIED_LIMITED
    enabled: false
    verified_on: "2026-11-02"
    provider_limits: {per_hour: 60}
    internal_budget: {per_hour: 30}
    freshness_seconds: 1800

  bluesky:
    name: Bluesky (public reads of official accounts)
    domain: social
    status: VERIFIED_LIMITED
    enabled: false
    verified_on: "2026-11-02"
    provider_limits: {}
    internal_budget: {min_interval_seconds: 5, per_hour: 120}
    freshness_seconds: 600

  manifold:
    name: Manifold Markets (read-only)
    domain: markets
    status: VERIFIED_LIMITED
    enabled: false
    verified_on: "2026-11-02"
    provider_limits: {per_minute: 500}
    internal_budget: {per_minute: 60}
    freshness_seconds: 300

  # --- News read once and shared by every market (need `news_feed`), never searched per market.
  spaceflight_news:
    name: Spaceflight News API v4
    domain: news
    status: VERIFIED_LIMITED
    enabled: true
    authentication: none
    verified_on: "2026-11-02"
    # OpenAPI schema and FAQ read 2026-11-02: no key, "fully free to use for everyone"; no rate
    # limit and no licence for the article data are published, so the budget stays very low.
    allow_commercial_use: true
    provider_limits: {}
    internal_budget: {min_interval_seconds: 300, per_hour: 12, per_day: 200}
    reserve_fraction: 0.2
    freshness_seconds: 900
    attribution: "Spaceflight News API (The Space Devs); each item names its publisher"
    capabilities: {news_feed: 0.5}

  # Publisher feeds: the adapter exists (connector rss_feed) but NO feed may be switched on until
  # an authorisation covering this use is obtained and written in docs/API_CATALOG.md. The terms
  # read on 2026-11-04 restrict automated collection, metadata extraction and AI uses (BBC,
  # Guardian); DW's are not established. Each stays UNVERIFIED, and the registry refuses to enable
  # it. The addresses are the ones the publishers advertise and have not been fetched.
  bbc_news_world:
    name: BBC News - World (RSS)
    domain: news
    status: UNVERIFIED
    enabled: false
    connector: rss_feed
    endpoint: "https://feeds.bbci.co.uk/news/world/rss.xml"
    attribution: "BBC News"
    capabilities: {news_feed: 0.4}

  guardian_world:
    name: The Guardian - World (RSS)
    domain: news
    status: UNVERIFIED
    enabled: false
    connector: rss_feed
    endpoint: "https://www.theguardian.com/world/rss"
    attribution: "The Guardian"
    capabilities: {news_feed: 0.4}

  dw_top_stories:
    name: Deutsche Welle - Top stories (RSS)
    domain: news
    status: UNVERIFIED
    enabled: false
    connector: rss_feed
    endpoint: "https://rss.dw.com/rdf/rss-en-top"
    attribution: "DW"
    capabilities: {news_feed: 0.4}
